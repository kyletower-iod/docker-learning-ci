name: Docker Build & Push

on:
  push:
    branches: ['main', 'dev']
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  build-and-push-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Run our tests BEFORE building
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # CRITICAL: 'npm ci' requires a package-lock.json file in your repo!
      # Ensure you commit package-lock.json to GitHub.
      - name: Install API Dependencies
        working-directory: ./api
        run: npm ci

      - name: Run API Tests
        working-directory: ./api
        run: npm test

      # If tests pass, log into Docker
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/myapi:latest

  # Run the client build concurrently
  build-and-push-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Client
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/myclient:latest