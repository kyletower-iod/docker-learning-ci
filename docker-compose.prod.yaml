services:
  api:
    image: kyletoweriod/myapi:latest
    platform: linux/amd64
    container_name: prod_api
    ports:
      - '4000:4000'
    restart: always

  client:
    image: kyletoweriod/myclient:latest
    platform: linux/amd64
    container_name: prod_client
    ports:
      - '8080:5173' # Using 8080 for Production to separate it from Dev
    restart: always

  # The Updater Service
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    command: --interval 30 # Check for updates every 30 seconds
    volumes:
      # This allows Watchtower to talk to the core Docker engine to restart containers
      - /var/run/docker.sock:/var/run/docker.sock